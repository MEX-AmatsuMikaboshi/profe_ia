    {
      "location": "forallx-yyc-prooftfl.tex",
      "linea": "Suppose we want to show that the argument $(A \\eand B) \\eor (A \\eand C) \\therefore A \\eand (B \\eor C)$ is valid. We start the proof by writing the premise and conclusion down. (On a piece of paper, you would want as much space as possible between them, so write the premises at the top of the sheet and the conclusion at the bottom.)",
      "motivo": "prosa alrededor de la fórmula"
    },
    {
      "location": "forallx-yyc-prooftfl.tex",
      "linea": "When applying the strategies, you will sometimes find yourself in a situation where you can justify~$\\ered$. Using the explosion rule, this would allow you to justify \\emph{anything}. So $\\ered$ works like a wildcard in proofs. For instance, suppose you want to give a proof of the argument $A \\eor B, \\enot A \\therefore B$. You set up your proof, writing the premises $A \\eor B$ and $\\enot A$ at the top on lines $1$ and $2$, and the conclusion~$B$ at the bottom of the page. $B$ has no main connective, so you can't work backward from it. Instead, you must work forward from $A \\eor B$: That requires two subproofs, like so:",
      "motivo": "prosa alrededor de la fórmula"
    },
    {
      "location": "forallx-yyc-prooftfl.tex",
      "linea": "\\item Show that $ \\enot \\enot L,  (C \\eif \\enot L) \\eif C) \\therefore \\enot C$ is invalid.",
      "motivo": "no es fórmula del cálculo: (C→¬L)→C)"
    }
  ],
