        },
        {
          "level": 3,
          "text": "La meta no tiene conectivo principal, así que ninguna regla de introducción la construye: tendrá que salir de eliminar el conectivo principal de alguna premisa, o de una prueba indirecta (IP), que abre una subprueba suponiendo la negación de la meta.",
