          ],
          "proposedMasteryDisqualifying": true,
          "nonRevelationExplanation": "Nombra la región relevante y el tipo de regla, sin decir sobre qué líneas se aplica ni qué fórmula intermedia produce.",
          "masteryFacts": {
            "level": 2,
            "levelOneReminderOnly": false,
            "selectsRuleOrNextStep": true,
            "containsDecisiveContent": false
