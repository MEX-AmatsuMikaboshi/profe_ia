      "itemId": "res-cita-subprueba",
      "section": "restrictions",
      "statement": "Para citar una subprueba: debe estar entera antes de la aplicación, no puede quedar dentro de otra subprueba ya cerrada, y su última línea no puede estar dentro de una subprueba anidada.",
      "anchors": [
        {
          "fragmentId": "forallx-yyc/tfl-deduccion-natural@master@ec34df8 (2025-12-18)#forallx-yyc-prooftfl.tex#additional-assumptions-and-subproofs",
