name: ci

# Checks bloqueantes en `main` (Plan.md §10, T-H0-05). Un criterio de
# aceptación que cite un check se considera cumplido solo con ese check en
# verde en `main` (§0.4).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'

jobs:
  base:
    name: ci:lint · ci:typecheck · ci:unit · ci:build
    runs-on: ubuntu-latest
    steps:
      # `content/` es un repositorio privado aparte (D-2). `secrets.GITHUB_TOKEN`
      # solo alcanza a este repositorio, así que el clon del submódulo falla con
      # `Repository not found`. Se usa un PAT fine-grained de solo lectura, que
      # checkout aplica tanto al repo principal como al submódulo: necesita
      # `Contents: Read` sobre `profe_ia` **y** sobre `profe_ia_contenido`.
      - name: CONTENT_TOKEN presente
        # Escalar de bloque: el mensaje lleva `: ` y en un escalar plano de YAML
        # eso se parsea como mapa y rompe el workflow entero.
        run: |
          test -n "$T" || {
            echo "::error::Falta el secreto CONTENT_TOKEN. Sin él no se puede clonar el submódulo privado content/ (D-2)."
            exit 1
          }
        env:
          T: ${{ secrets.CONTENT_TOKEN }}
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CONTENT_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ci:lint
        run: pnpm run ci:lint
      - name: ci:typecheck
        run: pnpm run ci:typecheck
      - name: ci:unit
        run: pnpm run ci:unit
      - name: ci:build
        run: pnpm run ci:build

  h6:
    # AC del gate H6 (Plan.md §F7). Va en su propio job y no como paso de
    # `base` porque §0.4 cuenta un AC como cumplido sólo con **el check que
    # cita** en verde: dentro de `ci:unit` estas pruebas corren, pero el acta no
    # podría citar nada que se pueda mirar por separado en Actions.
    #
    # No necesita el submódulo de contenido: la sesión seca usa paquete
    # sintético de desarrollo, que es lo que §F7 admite mientras no haya corpus.
    name: ci:mode-separation · ci:e2e:dry-session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Las pruebas entran por `@profesor-ia/*`, que resuelve a `dist/`.
      - name: build
        run: pnpm run ci:build
      # LEARNING/MEASUREMENT separados por pruebas; la sonda desactiva la ayuda.
      - name: ci:mode-separation
        run: pnpm run ci:mode-separation
      # Sesión seca completa reconstruible desde eventos, con las cinco
      # propiedades de §F7.
      - name: ci:e2e:dry-session
        run: pnpm run ci:e2e:dry-session

  adversarial:
    # AC de `T-H7-03`: extracción e injection del alumno (lista P-II §14.4
    # aplicable a sesión) y la puerta de no revelación de P-I §9.6. Job propio
    # por lo mismo que `h6`: §0.4 cuenta un AC por **el check que cita**, y
    # dentro de `ci:unit` no habría nada que mirar por separado en Actions.
    #
    # La suite vive en dos paquetes a propósito —`model-gateway` y
    # `pedagogy-policy`—; un archivo único abriría una dependencia que la
    # arquitectura no necesita.
    name: ci:adversarial:session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Las pruebas entran por `@profesor-ia/*`, que resuelve a `dist/`.
      - name: build
        run: pnpm run ci:build
      - name: ci:adversarial:session
        run: pnpm run ci:adversarial:session

  arch:
    name: ci:arch:depcruise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los paquetes del workspace exponen `dist/`, así que sin build previo
      # depcruise no resuelve `@profesor-ia/*` y falla por `sin-dependencias-no-resueltas`.
      # En local pasaba por tener `dist/` de corridas anteriores.
      - name: build (depcruise resuelve por `exports`, que apuntan a `dist/`)
        run: pnpm run ci:build
      - name: ci:arch:depcruise
        run: pnpm run ci:arch:depcruise
      # AC de F0: la regla debe fallar ante una violación sembrada y pasar al retirarla.
      - name: ci:arch:depcruise (violación sembrada)
        run: node scripts/arch/verify-depcruise-catches.mjs
      # Control positivo del typecheck de las pruebas: comprueba que los archivos
      # de `test/` los compila alguien y que un error sembrado ahí se ve. Sin él,
      # recortar el `include` de un `tsconfig.test.json` dejaría el check pasando
      # sin mirar ninguna prueba — que es exactamente el hueco que cerró.
      - name: ci:arch:test-typecheck (error sembrado en una prueba)
        run: node scripts/arch/verify-test-typecheck-catches.mjs
      # Fallo cerrado de la pasarela (F4): no envía parámetros no declarados por
      # el binding ni acepta un binding sin snapshot ni huella. Vive en el job
      # `arch` porque no necesita el submódulo de contenido.
      - name: ci:gateway:fail-closed
        run: pnpm run ci:gateway:fail-closed
      # Contract tests equivalentes por adaptador (P-II §8.4): una misma
      # operación conserva sus invariantes aunque cambien las peculiaridades del
      # proveedor.
      - name: ci:gateway:contracts
        run: pnpm run ci:gateway:contracts
      # Canarios (P-II §11.3): registro, detección por superficie, bloqueo de
      # corrida y encaje real con el filtro de egreso de la pasarela.
      - name: ci:canary
        run: pnpm run ci:canary
      # Ledger de costos (P-II §9.5): un cambio de tarifa crea manifiesto nuevo
      # y el costo histórico no se reescribe.
      - name: ci:cost:ledger
        run: pnpm run ci:cost:ledger

  logic:
    # Núcleo lógico (F2/H2): el gate exige 0 falsos positivos y 0 falsos
    # negativos conocidos sin resolver sobre el conjunto vigente.
    name: ci:logic:golden · ci:logic:pbt · ci:logic:no-net
    runs-on: ubuntu-latest
    steps:
      # Ver la nota del job `base`: el submódulo privado exige el PAT.
      - name: CONTENT_TOKEN presente
        # Escalar de bloque: el mensaje lleva `: ` y en un escalar plano de YAML
        # eso se parsea como mapa y rompe el workflow entero.
        run: |
          test -n "$T" || {
            echo "::error::Falta el secreto CONTENT_TOKEN. Sin él no se puede clonar el submódulo privado content/ (D-2)."
            exit 1
          }
        env:
          T: ${{ secrets.CONTENT_TOKEN }}
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CONTENT_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ci:logic:golden
        run: pnpm run ci:logic:golden
      - name: ci:logic:pbt
        run: pnpm run ci:logic:pbt
      - name: ci:logic:no-net
        run: pnpm run ci:logic:no-net
      # La tabla de mangos es derivada del corpus (D-77): si el corpus cambia y
      # nadie la regenera, un informe de BENCH-01 lleno de `F-…` deja de ser
      # auditable. Va en este job porque necesita el submódulo de contenido.
      - name: ci:content:mangos
        run: pnpm run ci:build && pnpm run ci:content:mangos
      # El conjunto dorado es reproducible por semilla: regenerarlo no debe
      # cambiar nada. Un diff aquí significa que el generador o el cálculo cambió.
      #
      # El diff va **dentro** del submódulo. Desde que D-2 se cerró, el índice del
      # padre solo guarda un gitlink para `content/unidad-deduccion-natural`, así
      # que `git diff -- content/…/golden-tests` desde el padre no ve ningún
      # cambio de contenido y devuelve 0 siempre: el check pasaba por vacío.
      # Comprobado sembrando un cambio en un caso dorado antes de escribir esto.
      # `add -A` + `--cached` porque `git diff` a secas tampoco vería un caso nuevo.
      - name: conjunto dorado reproducible
        run: |
          pnpm run ci:build
          pnpm run logic:golden:generate
          git -C content/unidad-deduccion-natural add -A golden-tests
          git -C content/unidad-deduccion-natural diff --cached --exit-code -- golden-tests

  mutation:
    # ci:logic:mutation — lento; se ejecuta en main y bajo demanda.
    name: ci:logic:mutation
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ci:logic:mutation
        run: pnpm run ci:logic:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation

  supply:
    name: ci:supply:sbom · ci:supply:drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ci:supply:drift
        run: pnpm run ci:supply:drift
      - name: ci:supply:sbom
        run: pnpm run ci:supply:sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: supply/sbom.cdx.json

  infra-otel:
    # AC de `T-H3-05`: la telemetría local llega al colector, y sólo la
    # telemetría. Job propio y no un paso de otro por lo mismo que `h6`: §0.4
    # cuenta un AC como cumplido sólo con **el check que cita** en verde, y
    # dentro de un job compartido no habría nada que mirar por separado en
    # Actions.
    #
    # Es el único check que necesita **contenedores en marcha**, no sólo la
    # configuración resuelta: hasta que un span cruza de `api` al colector, todo
    # lo demás afirma que el código debería exportar, no que exporta.
    name: ci:infra:otel
    runs-on: ubuntu-latest
    # Levanta imágenes y espera healthchecks; sin tope, un colector que no
    # arranca se lleva las seis horas por omisión del runner.
    timeout-minutes: 30
    steps:
      # Sin submódulo de contenido a propósito: el check levanta sólo el canal
      # de veredicto (`otel-collector`, `api`, `verifier` y la base), y ninguno
      # de esos monta `content/`. Pedir el PAT aquí sería exigir un secreto que
      # este job no usa.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `.env` no se versiona (T-H3-02) y el compose lo exige: sin él, los
      # `${VAR:?}` de la base tumban la resolución antes de arrancar nada. Los
      # secretos son de un solo uso y mueren con el runner. Las cuatro
      # `MODEL_CREDENTIAL_*` quedan vacías y da igual: ningún servicio de este
      # canal las usa, y un proveedor de modelo no pinta en una prueba de
      # telemetría.
      - name: dev:env (secretos efímeros del runner)
        run: pnpm run dev:env
      - name: ci:infra:otel
        run: pnpm run ci:infra:otel
      # Si el check falla, lo que hace falta para diagnosticar es lo que el
      # colector imprimió, no el resumen del check.
      - name: salida del colector
        if: failure()
        # Una sola línea a propósito: la continuación con `\` dentro de un
        # escalar de bloque es justo donde se cuela un espacio invisible.
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env logs --no-log-prefix otel-collector | tail -400

  infra:
    # ACs del gate H3: hardening (`T-H3-04`) y «el sistema se levanta desde
    # cero» (`T-H3-01`). Hasta ahora **no estaban en CI**: se corrían en la
    # máquina del propietario y el acta lo anotaba, pero §0.4 pide el check en
    # verde en `main`, y un check que sólo existe en un portátil no lo cumple.
    #
    # Los dos en el mismo job y con los dos nombres en el título, como `h6`:
    # comparten stack, y levantarlo dos veces no comprobaría nada más.
    name: ci:infra:hardening · ci:infra:compose-up
    runs-on: ubuntu-latest
    # Diez servicios, con Infisical y sus 60 s de `start_period`, más la build.
    timeout-minutes: 40
    steps:
      # Aquí **sí** hace falta el submódulo: `compose-up` levanta el stack
      # entero, y `authoring-worker` y `measurement-worker` montan rutas de
      # `content/`. Sin él, Docker crearía directorios vacíos en su lugar y el
      # check diría «levanta» sobre un sistema que no es el que se despliega.
      - name: CONTENT_TOKEN presente
        run: |
          test -n "$T" || {
            echo "::error::Falta el secreto CONTENT_TOKEN. Sin él no se puede clonar el submódulo privado content/ (D-2)."
            exit 1
          }
        env:
          T: ${{ secrets.CONTENT_TOKEN }}
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CONTENT_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Mismo motivo que en `ci:infra:otel`: `.env` no se versiona y el compose
      # lo exige. Secretos de un solo uso que mueren con el runner.
      - name: dev:env (secretos efímeros del runner)
        run: pnpm run dev:env
      # Lee la configuración **resuelta** por Docker, no el YAML fuente, así que
      # va antes de levantar nada: si una frontera está mal declarada, no hace
      # falta arrancar diez contenedores para saberlo.
      - name: ci:infra:hardening
        run: pnpm run ci:infra:hardening
      - name: ci:infra:compose-up
        run: pnpm run ci:infra:compose-up
      - name: estado y logs de los servicios
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env ps -a; docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env logs --tail 120

  db:
    # PostgreSQL 17 real vía Testcontainers: un mock no prueba permisos (§10).
    name: ci:db:testcontainers · ci:db:negative
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (la matriz compilada alimenta al generador de grants)
        run: pnpm run ci:build
      # La migración de GRANT es generada: si no corresponde a la matriz, falla.
      - name: db:grants:check
        run: pnpm run db:grants:check
      - name: ci:db:negative
        run: pnpm run ci:db:negative
